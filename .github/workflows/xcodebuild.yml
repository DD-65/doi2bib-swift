name: Xcode Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project HelloMac.xcodeproj \
            -scheme HelloMac \
            -destination 'platform=macOS' \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project HelloMac.xcodeproj \
            -scheme HelloMac \
            -destination 'platform=macOS' \
            test